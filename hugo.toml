baseURL = "https://docs.retrofit.sh/"
locale = "en-us"
title = "retrofit"

# Nothing here uses taxonomies; without this Hugo builds empty /categories/
# and /tags/ pages and lists them in the sitemap.
disableKinds = ["taxonomy", "term"]

# The docs tree names its files after commands (retrofit-data-capture.md);
# keep the paths exactly as the generator writes them.
disablePathToLower = true

enableRobotsTXT = false

# The theme, pinned in go.mod. Update with
#   hugo mod get github.com/alex-shpak/hugo-book@<commit>
[module]
  [module.hugoVersion]
    min = "0.146.0"

  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

  # Declaring any mount drops Hugo's defaults, so every component this
  # repository supplies is listed.
  #
  # No docs content is committed. `make build` and `make serve` write the
  # tree from retrofit into _tree/ (retrofit's `go run ./cmd/docs`), and
  # these two mounts read it: the pages, and the manifest that names them.
  [[module.mounts]]
    source = "_tree/content"
    target = "content"
  [[module.mounts]]
    source = "_tree/manifest.json"
    target = "data/manifest.json"
  # Written by versions/ for a versioned build only: the lines, the newest,
  # and which path this build is (the canonical link, the version switcher).
  [[module.mounts]]
    source = "_tree/versions.json"
    target = "data/versions.json"

  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"

[markup]
  # Code blocks are literals in ink on --panel, like every other literal.
  # Hugo's default writes a dark monokai palette inline; with classes and no
  # highlighting stylesheet, Chroma's markup carries no colour.
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  # Where the top bar's name links: the landing page is retrofit.sh.
  homeURL = "https://retrofit.sh/"

  # The left navigation is manifest.json's sections (layouts/_partials/nav.html),
  # not hugo-book's file tree, so BookSection is unset.

  # Light only: the design system has no dark mode, and hugo-book has no toggle.
  BookTheme = "light"
  BookToC = true
  BookSearch = true

  # The generated prose links its siblings as `import.md`. Portable links
  # resolve those to the page's URL, and 'error' fails the build when one
  # names a page the tree does not have.
  BookPortableLinks = "error"

  # Off: no comments, no "edit this page" (the source is private), no
  # last-change link, no service worker.
  BookComments = false
  BookServiceWorker = false

  # Plausible's script: retrofit.sh's site, shared, so a visit from
  # retrofit.sh to the docs is one session; filter by hostname to tell them
  # apart. Empty keeps analytics off everywhere; set, it still loads only on
  # the live site (layouts/_partials/analytics.html).
  plausibleScript = "https://plausible.io/js/pa-ekHp-PeoKawcOiXpWU2KZ.js"

# analytics.html reads Netlify's CONTEXT and URL, as retrofit-site does.
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^CONTEXT$', '^URL$']
