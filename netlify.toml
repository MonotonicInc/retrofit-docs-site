# Netlify build + deploy configuration for docs.retrofit.sh
#
# The Hugo pin matches retrofit-site's, so both sites build on the same
# version; hugo-book (go.mod) needs 0.158 or later. Hugo fetches the theme
# module with Go, which the Netlify image provides.
#
# `make versions` builds what versions.toml publishes: before 1.0, /current/
# only, from the docs bundle the newest full release on MonotonicHQ/retrofit
# carries, checked against that release's checksums.txt. So a release's call
# to the build hook publishes it with no edit to versions.toml. It needs no
# access to a private repository. Until the first full release, /current/
# is the newest WIP's, and a WIP's call publishes it. Until a WIP carries a
# bundle (retrofit kata abgt) it has nothing to build and fails. Set GITHUB_TOKEN in the site's environment to lift the API's
# unauthenticated rate limit.

[build]
  publish = "public"
  command = "make versions"

# HUGO_ENV is set per context below, not here: values in [build.environment]
# apply to every context, so setting it here would make hugo.IsProduction
# true on deploy previews and branch deploys too.
[build.environment]
  HUGO_VERSION = "0.165.0"
  # Go builds versions/ and fetches the hugo-book module; both go.mod files
  # need 1.25 or later, and the image's default Go is not pinned.
  GO_VERSION = "1.26.10"
  TZ = "UTC"

[context.production.environment]
  HUGO_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

# Preview and branch deploys build against their own host and set
# HUGO_PARAMS_NOINDEX, which emits noindex on every page
# (layouts/_partials/docs/inject/head.html), so a crawled preview is not a
# second, self-canonical copy of the docs.
[context.deploy-preview]
  command = "make versions BASE_URL=$DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
  HUGO_PARAMS_NOINDEX = "true"

[context.branch-deploy]
  command = "make versions BASE_URL=$DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
  HUGO_PARAMS_NOINDEX = "true"
