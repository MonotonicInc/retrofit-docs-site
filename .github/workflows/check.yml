name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The design system copies against style.lock. CI has no retrofit-site
  # checkout (it is private), so this holds the copies to the pin; drift
  # in retrofit-site itself is caught where a checkout is present.
  style-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make style-check

  # The versioned build (versions/): the release selection, the checksum
  # refusal, and two fixture lines built with Hugo into /X.Y/ and /current/.
  # Hugo is the version netlify.toml pins, checked against its release's
  # checksums.
  versions:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.165.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: versions/go.mod
          cache-dependency-path: versions/go.sum
      - name: Install Hugo
        run: |
          set -euo pipefail
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tgz="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tgz"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $tgz\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p hugo && tar -xzf "$tgz" -C hugo hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - run: make versions-test
