name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The design system copies against style.lock. CI has no retrofit-site
  # checkout (it is private), so this holds the copies to the pin; drift
  # in retrofit-site itself is caught where a checkout is present.
  style-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make style-check
